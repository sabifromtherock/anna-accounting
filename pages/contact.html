<section class="section contact" aria-labelledby="contact-title">
  <div class="container contact-box">
    <header class="section-header">
      <h2 id="contact-title" data-i18n="contact_title"></h2>
      <p class="section-subtitle" data-i18n="contact_subtitle"></p>
    </header>

    <!-- Contact details -->
    <address class="contact-details" aria-label="Contact information">
      <!-- Email -->
      <a
        class="contact-card"
        href="mailto:anna@annasaccounting.co.uk"
        target="_blank"
        aria-label="Send an email to Anna"
      >
        <img
          class="contact-icon"
          src="../assets/icons/email.svg"
          alt=""
          aria-hidden="true"
        />
        <span>anna@annasaccounting.co.uk</span>
      </a>

      <!-- Phone -->
      <a
        class="contact-card"
        href="tel:+447845585602"
        aria-label="Call Anna by phone"
      >
        <img
          class="contact-icon"
          src="../assets/icons/phone.svg"
          alt=""
          aria-hidden="true"
        />
        <span>+44 7845 585602</span>
      </a>

      <!-- WhatsApp -->
      <a
        class="contact-card"
        href="https://wa.me/447845585602"
        target="_blank"
        rel="noopener"
        aria-label="Chat with Anna on WhatsApp"
      >
        <img
          class="contact-icon"
          src="../assets/icons/whatsapp.svg"
          alt=""
          aria-hidden="true"
        />
        <span>WhatsApp</span>
      </a>

      <!-- Viber -->
      <a
        class="contact-card"
        href="viber://chat?number=%2B447845585602"
        target="_blank"
        rel="noopener"
        aria-label="Chat with Anna on Viber"
      >
        <img
          class="contact-icon"
          src="../assets/icons/viber.svg"
          alt=""
          aria-hidden="true"
        />
        <span>Viber</span>
      </a>

      <!-- Facebook -->
      <a
        class="contact-card"
        href="https://www.facebook.com/"
        target="_blank"
        rel="noopener"
        aria-label="Visit Anna on Facebook"
      >
        <img
          class="contact-icon"
          src="../assets/icons/facebook.svg"
          alt=""
          aria-hidden="true"
        />
        <span>Facebook</span>
      </a>

      <!-- Location -->
      <div class="contact-card contact-location" role="text">
        <img
          class="contact-icon"
          src="../assets/icons/location.svg"
          alt=""
          aria-hidden="true"
        />
        <span data-i18n="contact_location"></span>
      </div>
    </address>
  </div>
</section>
